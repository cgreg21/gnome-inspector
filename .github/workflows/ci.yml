name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libadwaita-1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Validate extension JavaScript syntax
        run: node --input-type=module --check < extension/extension.js
      - name: Validate extension metadata
        run: python3 -m json.tool extension/metadata.json > /dev/null
