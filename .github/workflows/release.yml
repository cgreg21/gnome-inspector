name: Alpha release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build Linux alpha archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libadwaita-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build distributable archive
        run: bash scripts/package-alpha.sh

      - name: Publish draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.tar.gz
