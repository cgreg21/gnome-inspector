name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libadwaita-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --all-features

      - name: Run Rust tests with backtraces
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug
        run: cargo test --all-targets --all-features -- --nocapture


      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Inspect dependency tree
        run: cargo tree --duplicates

      - name: Install Rust diagnostic tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-audit,cargo-machete

      - name: Run nextest
        env:
          RUST_BACKTRACE: full
        run: cargo nextest run --all-targets --all-features --no-fail-fast

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Audit Rust dependencies
        run: |
          cargo generate-lockfile
          cargo audit

      - name: Detect unused dependencies
        run: cargo machete

      - name: Upload Rust coverage
        if: always() && hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: ignore

  extension:
    name: Extension tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install --yes nodejs npm shellcheck python3

      - name: Test actor tree traversal
        run: node --test --test-reporter=spec extension/*.test.js

      - name: Validate JavaScript syntax
        run: |
          node --input-type=module --check < extension/extension.js
          node --input-type=module --check < extension/actor-tree.js
          node --input-type=module --check < extension/property-editor.js
          node --input-type=module --check < extension/style-tree.js
          node --input-type=module --check < extension/theme-stylesheets.js
          node --check extension/actor-tree.test.js

      - name: Validate extension metadata
        run: python3 -m json.tool extension/metadata.json > /dev/null

      - name: Test GNOME runtime compatibility
        run: bash scripts/test-runtime.sh

      - name: Test release tag validation
        run: bash scripts/test-release-tag.sh

      - name: Test per-user installation and removal
        run: bash scripts/test-install.sh

      - name: Test alpha archive packaging and installation
        run: bash scripts/test-package.sh

      - name: ShellCheck integration scripts
        run: shellcheck scripts/test-gnome-shell-51.sh scripts/test-install.sh scripts/test-package.sh scripts/test-runtime.sh scripts/test-release-tag.sh scripts/check-release-tag.sh scripts/check-runtime.sh scripts/package-alpha.sh scripts/install-bundle.sh scripts/uninstall-bundle.sh scripts/capture-readme-screenshots.sh scripts/install-extension.sh scripts/install.sh scripts/uninstall.sh

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint:1.7.11
        with:
          args: -color

  gnome-shell-51:
    name: GNOME Shell 51 virtual session
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@v4

      - name: Install GNOME Shell 51 runtime
        run: |
          dnf install --assumeyes gnome-shell gjs dbus-daemon glib2 nodejs python3 python3-dbusmock shadow-utils util-linux
          gnome-shell --version

      - name: Start the system D-Bus daemon
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork --nopidfile
          gdbus call --system --dest org.freedesktop.DBus \
            --object-path /org/freedesktop/DBus \
            --method org.freedesktop.DBus.ListNames > /dev/null

      - name: Start mocked systemd-logind service
        run: |
          python3 -m dbusmock --system --template logind > "$GITHUB_WORKSPACE/login1-mock.log" 2>&1 &
          for _ in $(seq 1 15); do
            if gdbus call --system --dest org.freedesktop.login1 \
              --object-path /org/freedesktop/login1 \
              --method org.freedesktop.DBus.Peer.Ping > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          gdbus call --system --dest org.freedesktop.login1 \
            --object-path /org/freedesktop/login1 \
            --method org.freedesktop.DBus.Peer.Ping > /dev/null

      - name: Create unprivileged test account
        run: |
          useradd --create-home --shell /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Start virtual headless session and test extension
        env:
          GNOME_TEST_LOG: ${{ github.workspace }}/gnome-shell-51.log
        run: |
          runuser -u ci -- env GNOME_TEST_LOG="$GNOME_TEST_LOG" \
            dbus-run-session -- bash "$GITHUB_WORKSPACE/scripts/test-gnome-shell-51.sh"

      - name: Upload GNOME Shell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell-51-logs
          path: |
            gnome-shell-51.log
            login1-mock.log
          if-no-files-found: warn

  screenshots:
    name: Capture README screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install GTK, D-Bus and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            gjs dbus-x11 xvfb xdotool x11-apps imagemagick

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Capture each application module
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            bash scripts/capture-readme-screenshots.sh

      - name: Commit README screenshots
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: update README screenshots"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gnome-inspector-readme-screenshots
          path: screenshots/*.png
          if-no-files-found: error
